[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapling-mcp-server"
version = "0.1.0"
description = "A minimal MCP server wrapping Scrapling's stealthy_fetch with cookie.txt support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "scrapling[ai]>=0.4.7",
    "mcp>=1.0.0,<2.0.0",
    "markdownify>=1.2.0",
]

[project.scripts]
scrapling-mcp-server = "scrapling_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapling_mcp_server"]
